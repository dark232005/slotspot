version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: slotspot-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pwd_123}
      POSTGRES_DB: ${POSTGRES_DB:-slotspot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slotspot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slotspot-prod-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pwd_123}@postgres:5432/${POSTGRES_DB:-slotspot}
      SECRET_KEY: ${SECRET_KEY:-prod-secret-key-slotspot-btech-2026-supersecure}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DEFAULT_NO_SHOW_GRACE_MINUTES: 10
      NO_SHOW_CHECK_INTERVAL_SECONDS: 15
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - slotspot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: slotspot-prod-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - slotspot-net

volumes:
  postgres_data:
    driver: local

networks:
  slotspot-net:
    driver: bridge
